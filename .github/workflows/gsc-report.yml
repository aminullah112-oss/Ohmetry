name: Weekly Search Console report

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull Search Console data
        run: node scripts/gsc-report.mjs
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
      - name: Commit the report
        run: |
          git config user.name "ohmetry-bot"
          git config user.email "hello@ohmetry.com"
          git add docs/seo/gsc-report.md || true
          git diff --cached --quiet || (git commit -m "Weekly Search Console report" && git push)
