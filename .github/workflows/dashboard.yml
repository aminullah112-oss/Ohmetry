name: Progress dashboard

on:
  push:
    branches: [main]
    paths-ignore: ['docs/seo/**']
  schedule:
    - cron: '30 6 * * *' # daily, 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site for the audit
        run: npm run build
      - name: SEO audit data
        run: npm run seo
        env:
          AUDIT_JSON: docs/seo/audit-latest.json
        continue-on-error: true
      - name: Search Console data
        run: node scripts/gsc-report.mjs
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        continue-on-error: true
      - name: Cloudflare Web Analytics data
        run: node scripts/cf-analytics.mjs
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SITE_TAG: ${{ vars.CF_SITE_TAG }}
        continue-on-error: true
      - name: Add today's snapshot
        run: node scripts/dashboard-data.mjs
      - name: Build the dashboard
        run: node scripts/build-dashboard.mjs
      - name: Save the data in the repository
        run: |
          git config user.name "ohmetry-bot"
          git config user.email "hello@ohmetry.com"
          git add docs/seo
          git diff --cached --quiet || (git commit -m "Update dashboard data" && git pull --rebase origin main && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard-dist
      - id: deployment
        uses: actions/deploy-pages@v4
