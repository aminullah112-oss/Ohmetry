name: Link check (lychee)

# Advisory only. Builds the site and checks every internal and external link in the built HTML.
# `fail: false` means broken links are reported in the run summary but never fail the run.
# Read-only permissions, no repository secrets, own workflow so the deploy and dashboard secrets are never exposed.

on:
  schedule:
    - cron: '23 7 * * 5' # Fridays, 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check links
        # lychee-action v2.9.0, pinned to its commit
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --no-progress --max-concurrency 4 --root-dir ${{ github.workspace }}/dist --exclude '^mailto:' --exclude 'gumroad\.com' './dist/**/*.html'
          fail: false
          jobSummary: true
          output: lychee-report.md
      - name: Print report
        if: always()
        run: |
          echo "::group::lychee report"; cat lychee-report.md || true; echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lychee-report
          path: lychee-report.md
          retention-days: 30
          if-no-files-found: warn
